name: Publish release

on:
  release:
    types: [published]

permissions: {}

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  workflow-safety:
    name: Validate release workflows
    permissions:
      contents: read
    # The released actionlint does not support $/ yet; reusable ./ calls use the caller commit.
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository]

  build:
    name: Verify tag and build distributions
    needs: workflow-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify annotated tag and embedded version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release.py verify-tag "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          # Release builds never consume a cache populated by another workflow.
          enable-cache: false
      - name: Install locked release environment
        run: uv sync --locked --extra dev --extra docs --extra pdf --python 3.12
      - name: Check dependency consistency
        run: uv pip check
      - name: Check release quality and license notices
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyright
          uv run --no-sync python scripts/update_license_notices.py
          uv run --no-sync pip-audit --skip-editable
      - name: Build documentation with warnings as errors
        run: uv run --no-sync python -m sphinx.cmd.build -W --keep-going -b html docs docs/_build/html
      - name: Run offline documentation examples
        run: uv run --no-sync python -m sphinx.cmd.build -W --keep-going -b doctest docs docs/_build/doctest
      - name: Test release commit
        run: uv run --no-sync pytest
      - name: Build and validate distributions
        run: uv run --no-sync python scripts/release.py build
      - name: Validate installed wheel
        run: uv run --no-sync python scripts/check_distribution.py dist
      - name: Store distributions for the isolated publishing job
        id: distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pymdtools/
    permissions:
      id-token: write

    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
          digest-mismatch: error
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
