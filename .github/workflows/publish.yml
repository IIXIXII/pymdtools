name: Publish release

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-safety:
    name: Validate release workflows
    permissions:
      contents: read
    # The released actionlint does not support $/ yet; reusable ./ calls use the caller commit.
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository]

  build:
    name: Verify tag and build distributions
    needs: workflow-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
      notes-artifact-id: ${{ steps.notes.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify annotated tag and embedded version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py verify-tag "$RELEASE_TAG"
      - name: Require merged commit and successful master CI and CodeQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_checks.py
      - name: Extract release notes from the dated changelog section
        run: python scripts/release.py notes --output "$RUNNER_TEMP/release-notes.md"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          # Release builds never consume a cache populated by another workflow.
          enable-cache: false
      - name: Install locked release environment
        run: uv sync --locked --group dev --group docs --extra pdf --python 3.12
      - name: Check dependency consistency
        run: uv pip check
      - name: Check release quality and license notices
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyright
          uv run --no-sync python scripts/update_license_notices.py
          uv run --no-sync pip-audit --skip-editable
      - name: Build documentation with warnings as errors
        run: uv run --no-sync python -m sphinx.cmd.build -W --keep-going -b html docs docs/_build/html
      - name: Run offline documentation examples
        run: uv run --no-sync python -m sphinx.cmd.build -W --keep-going -b doctest docs docs/_build/doctest
      - name: Test release commit
        run: uv run --no-sync pytest
      - name: Build and validate distributions
        run: uv run --no-sync python scripts/release.py build
      - name: Validate installed wheel
        run: uv run --no-sync python scripts/check_distribution.py dist
      - name: Store distributions for the isolated publishing job
        id: distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Store the validated release notes
        id: notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pymdtools/
    permissions:
      id-token: write

    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
          digest-mismatch: error
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    name: Create GitHub release with notes and distributions
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Retrieve the distributions published to PyPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
          digest-mismatch: error
      - name: Retrieve validated release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.notes-artifact-id }}
          path: notes/
          merge-multiple: true
          digest-mismatch: error
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --verify-tag \
            --title "pymdtools ${RELEASE_TAG#v}" \
            --notes-file notes/release-notes.md
