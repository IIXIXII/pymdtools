name: Publish release

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify tag and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify annotated tag and embedded version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release.py verify-tag "$RELEASE_TAG"
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Install locked release environment
        run: uv sync --locked --extra dev --extra pdf --python 3.12
      - name: Check dependency consistency
        run: uv pip check
      - name: Test release commit
        run: uv run --no-sync pytest
      - name: Build and validate distributions
        run: uv run --no-sync python scripts/release.py build
      - name: Validate installed wheel
        run: uv run --no-sync python scripts/check_distribution.py dist
      - name: Store distributions for the isolated publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pymdtools/
    permissions:
      id-token: write

    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
