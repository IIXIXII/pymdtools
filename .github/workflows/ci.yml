name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-safety:
    name: Workflow validation
    # The released actionlint does not support $/ yet; reusable ./ calls use the caller commit.
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository]

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            python-version: "3.12"
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: tests-${{ matrix.python-version }}
          save-cache: ${{ github.event_name == 'push' }}
      - name: Install locked dependencies
        run: uv sync --locked --group dev --extra pdf --python ${{ matrix.python-version }}
      - name: Check dependency consistency
        run: uv pip check
      - name: Run test suite
        run: >-
          uv run --no-sync pytest
          --junitxml="$RUNNER_TEMP/reports/junit.xml"
          --cov-report="xml:$RUNNER_TEMP/reports/coverage.xml"
      - name: Preserve test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Types, documentation and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality
          save-cache: ${{ github.event_name == 'push' }}
      - name: Install locked dependencies
        run: uv sync --locked --group dev --group docs --extra pdf --python 3.12
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Audit installed dependencies
        run: uv run --no-sync pip-audit --skip-editable
      - name: Check bundled license notices
        run: uv run --no-sync python scripts/update_license_notices.py
      - name: Check dependency consistency
        run: uv pip check
      - name: Check version files
        run: uv run --no-sync python scripts/release.py check
      - name: Run core usage examples
        run: uv run --no-sync python examples/run_all.py --output "$RUNNER_TEMP/examples"
      - name: Run strict type checking
        run: uv run --no-sync pyright
      - name: Build documentation with warnings as errors
        run: uv run --no-sync python -m sphinx.cmd.build -W --keep-going -b html docs docs/_build/html
      - name: Run offline documentation examples
        run: uv run --no-sync python -m sphinx.cmd.build -W --keep-going -b doctest docs docs/_build/doctest
      - name: Build and validate distributions
        run: uv run --no-sync python scripts/release.py build
      - name: Test installed wheel and source archive
        run: uv run --no-sync python scripts/check_distribution.py dist
      - name: Check parser performance
        run: uv run --no-sync python scripts/benchmark_markdown.py --max-seconds 3
      - name: Preserve validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pdf:
    name: Real PDF renderer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: pdf
          save-cache: ${{ github.event_name == 'push' }}
      - run: uv sync --locked --group dev --extra pdf --python 3.12
      - run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - name: Render reference documents
        env:
          PYMDTOOLS_PDF_TESTS: "1"
        # Override only default coverage arguments; strict markers/warnings remain active.
        run: >-
          uv run --no-sync pytest -o addopts="-ra --strict-markers --strict-config --import-mode=importlib"
          -m pdf_integration --junitxml="$RUNNER_TEMP/reports/pdf.xml"
      - name: Preserve PDF test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run PDF usage examples
        run: uv run --no-sync python examples/run_all.py --only-pdf --output "$RUNNER_TEMP/pdf-examples"

  dependency-compatibility:
    name: Dependency boundaries
    uses: ./.github/workflows/compatibility.yml # zizmor: ignore[self-repository]

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs: [workflow-safety, tests, quality, pdf, dependency-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to succeed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_RESULTS"
