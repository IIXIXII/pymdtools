name: Dependency compatibility

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  latest:
    name: Latest dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Install latest compatible dependencies without changing uv.lock
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --upgrade -e ".[dev,pdf]"
          uv pip check
      - name: Test latest dependency versions
        run: uv run --no-sync pytest --junitxml="$RUNNER_TEMP/reports/junit.xml"
      - name: Preserve compatibility reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-py${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          retention-days: 7
