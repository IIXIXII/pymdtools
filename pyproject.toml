[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pymdtools"
dynamic = ["version"]
description = "Tools for inspecting, transforming and publishing Markdown documents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Florent Tournois", email = "florent.tournois@gmail.fr"}]
license = "MIT AND BSD-3-Clause AND Apache-2.0 AND LGPL-3.0-or-later AND Unlicense AND CC-BY-SA-3.0 AND LicenseRef-Glyphicons-Bootstrap AND LicenseRef-Theme-Permission-Review"
license-files = ["LICENSE.md", "LICENSES-3rd-party.md", "LICENSES-dependencies.md", "THIRD_PARTY_LICENSES/*"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "chardet>=5,<6",
  "markdown>=3.5,<4",
  "markdown-it-py>=3,<5",
  "markdownify>=1.1,<2",
  "mistune>=3,<4",
  "python-dateutil>=2.8,<3",
  "unidecode>=1.3,<2",
]

[project.urls]
Documentation = "https://pymdtools.readthedocs.io/"
Issues = "https://github.com/IIXIXII/pymdtools/issues"
Source = "https://github.com/IIXIXII/pymdtools"

[project.optional-dependencies]
pdf = ["playwright>=1.48,<2", "pypdf>=6,<7"]
dev = [
  "build>=1.2,<2", "pyright[nodejs]>=1.1.414,<2",
  "pytest>=7,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7",
  "tomli>=2; python_version < '3.11'", "ruff==0.16.9", "pip-audit>=2.9,<3", "twine>=5,<7",
]
docs = ["myst-parser>=3,<5", "sphinx>=8,<9", "sphinx-rtd-theme>=3,<4"]

[tool.setuptools.dynamic]
version = {attr = "pymdtools.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymdtools*"]

[tool.setuptools.package-data]
pymdtools = ["py.typed", "*.ico", "*.md", "layouts/**/*", "referenced_files/*.txt"]

[tool.pyright]
include = ["src/pymdtools", "scripts/release.py"]
exclude = ["tests", "build", "dist", "docs/_build", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "docs/_build", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "build", "dist", "docs", ".pytest_cache", ".hypothesis"]
filterwarnings = ["error"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --cov=pymdtools --cov-report=term-missing"
markers = ["pdf_integration: requires the installed Chromium browser (PYMDTOOLS_PDF_TESTS=1)"]

[tool.coverage.run]
branch = true
source = ["pymdtools"]
omit = ["*/tests/*", "*/_about.py", "*/version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError"]
